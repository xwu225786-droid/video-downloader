[project]
name = "voxpull"
version = "0.1.0"
description = "Local media archiving and video transcription for shared social links"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "lark-oapi==1.7.5",
    "fastapi>=0.139,<1",
    "httpx[socks]>=0.28,<1",
    "openai>=2,<3",
    "opencc-python-reimplemented>=0.1.7,<1",
    "pillow>=12.3,<13",
    "pillow-heif>=1.4,<2",
    "playwright>=1.61,<2",
    "uvicorn[standard]>=0.41,<1",
    "yt-dlp[default]>=2026.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
vox = "voxpull.cli:main"
voxpull = "voxpull.__main__:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxpull"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Preserve the exact user-supplied standalone algorithm, including its formatting.
"src/voxpull/infrastructure/mouse_trajectory.py" = ["E701", "E702"]
