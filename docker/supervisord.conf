[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/voxpull/supervisord.pid
childlogdir=/run/voxpull

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -s 0 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:window-manager]
command=/usr/bin/dbus-run-session -- /usr/bin/openbox --config-file /etc/voxpull-openbox.xml
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -nopw -rfbport 5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-console]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:application]
command=/usr/local/bin/python -m voxpull
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
